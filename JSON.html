<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON</title>
</head>

<body>

    <script>

        const jsonText = `{
            "name": "Zarah",
            "email": "zarahh@example.com",
            "message": "Hello Good Morning!"
        }`;

        const showMessage = () => {
            try {
                const user = JSON.parse(jsonText);

                console.log("Message received from " + user.name);
                console.log("Message: " + user.message);
            }
            catch (error) {
                console.log("Error: Invalid JSON or something went wrong.");
            }
        };

        showMessage();

    </script>

</body>

</html>
