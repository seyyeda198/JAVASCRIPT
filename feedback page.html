<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback page</title>
</head>
<body>
    <form>
<input type="text" id="userName" placeholder="Enter your name">
<br><br>
<textarea id="feedback" placeholder="Enter your feedback"></textarea>
<br><br>
<button type="button" onclick="showFeedback()">Submit</button>
</form>

<p id="name"></p>

<p id="feedbackResult"
onmouseover="this.style.color='blue'"
onmouseout="this.style.color='black'">
</p>

<p id="message"></p>

<script>

function showFeedback() {

let name = document.getElementById("userName").value;
let feedback = document.getElementById("feedback").value;

document.getElementById("name").innerHTML = "Name: " + name;

document.getElementById("feedbackResult").innerHTML = "Feedback: " + feedback;

document.getElementById("feedbackResult").style.color = "black";

document.getElementById("message").innerHTML = "Thanks for your feedback!";

document.getElementById("message").style.color = "green";

setTimeout(function() {
    document.getElementById("message").innerHTML = "";
}, 5000);

}

</script>
</body>
</html>
