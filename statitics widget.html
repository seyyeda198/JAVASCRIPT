<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statitics widget</title>
</head>
<body>
    <script>
        let whole = Math.floor(Math.random() * 100) + 1;
        let userscore = Number("75");
        let difference = whole - userscore;
        let sqroot = Math.round(Math.sqrt(userscore));
        let pi = Math.PI;
        let Num = "50" * 2;

        console.log("Random Number: " + whole);
        console.log("Userscore: " + userscore);
        console.log("Difference: " + difference);
        console.log("Rounded Square Root: " + sqroot);
        console.log("Value of Pi: " + pi);
        console.log("50 * 2: " + Num);

    </script>
</body>
</html>
