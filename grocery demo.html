<html>
<head>
    <title>Grocery Shop</title>
</head>

<body>

<script>

var name1 = "Rice";
var price1 = 150;
var quantity1 = 2;

var name2 = "Sugar";
var price2 = 50;
var quantity2 = 1;

var name3 = "Wheat";
var price3 = 200;
var quantity3 = 5;

var riceCost = price1 * quantity1;
var sugarCost = price2 * quantity2;
var wheatCost = price3 * quantity3;

console.log("Item: " + name1);
console.log("Price: " + price1);
console.log("Quantity: " + quantity1);
console.log("Rice Cost: " + riceCost);

console.log("Item: " + name2);
console.log("Price: " + price2);
console.log("Quantity: " + quantity2);
console.log("Sugar Cost: " + sugarCost);

console.log("Item: " + name3);
console.log("Price: " + price3);
console.log("Quantity: " + quantity3);
console.log("Wheat Cost: " + wheatCost);

var total = riceCost + sugarCost + wheatCost;

console.log("Total Bill: " + total);

quantity1 = 3;
riceCost = price1 * quantity1;
total = riceCost + sugarCost + wheatCost;

console.log("Updated Rice Quantity: " + quantity1);
console.log("Updated Total Bill: " + total);

</script>

</body>
</html>
